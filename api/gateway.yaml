openapi: 3.0.3
info:
  title: Gateway API
  version: "1.0"
  description: |
    Registers the data planes this control plane administers.

    A registration records three things: the id the data plane knows itself by, where it answers,
    and the management token it is configured with. Registering records where a data plane is and
    how to authenticate to it; it does not contact the data plane.

    The management token is **write-only**. It is held encrypted and is never returned by any
    response, because a read that returned it would hand every operator of this control plane the
    credentials to every data plane it administers.

    ## Authorization

    Every route here requires the **root system permission**, the one named by
    `server.security.system_permission_prefix` plus `system` (so `system` by default, or for example
    `tenant_instance:system` where a prefix is configured). A narrower permission is not enough for
    any of them, including the reads.

    A registration holds the credential to a data plane, and even the list of names and addresses is
    worth protecting: it describes the fleet. Reading it is therefore as privileged as changing it.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Gateways
    description: The data planes this control plane administers.

security:
  - OAuth2: [system]

paths:
  /gateways:
    get:
      tags: [Gateways]
      summary: List the registered gateways
      description: Returns every gateway this deployment administers, oldest first. No management token is included.
      responses:
        "200":
          description: The registered gateways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gateway'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Gateways]
      summary: Register a data plane
      description: |
        Records a data plane this control plane administers.

        The control plane issues the key it will present to that data plane and returns it once, in
        this response. Configure the data plane with it: nothing reads it back.

        The data plane is not contacted. An unreachable `baseUrl` is found when something first
        calls that data plane, not here.

        How many gateways a deployment may hold is bounded by `server.max_gateways`, which is one
        unless a deployment raises it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "production"
              baseUrl: "https://dp.example.com:8090"
      responses:
        "201":
          description: |
            The registered gateway, and the key it issued. This is the only response that carries
            the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /gateways/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The gateway's id.
    get:
      tags: [Gateways]
      summary: Get a gateway
      responses:
        "200":
          description: The gateway. The management token is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Gateways]
      summary: Change a gateway
      description: |
        Changes a registration. Only the fields the body names are touched, so an address can be
        moved without restating the certificate.

        `baseUrl` is what says which data plane this is, so moving it is how a data plane that moved
        is followed, and it is refused if another gateway already answers at that address.

        The key is not here. Rotating it returns a value the caller has to keep, which a
        partial update has nowhere to put: see `POST /gateways/{id}/key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
            example:
              baseUrl: "https://dp.example.com:9443"
      responses:
        "200":
          description: The updated gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Gateways]
      summary: Remove a gateway
      description: |
        Removes the registration. The data plane itself is untouched and keeps running with whatever
        configuration it already holds.
      responses:
        "204":
          description: The gateway was removed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /gateways/{id}/key:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Gateways]
      summary: Rotate a gateway's key
      description: |
        Issues a new key for this gateway and returns it once.

        There is nothing to send: the control plane is the side that generates it. The previous key
        stops working the moment this returns, so the data plane drops until it is configured with
        the new one. That is the point of a rotation.

        This is the only way back from a lost key. Nothing reads the stored one.
      responses:
        "200":
          description: The new key
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
                    format: password
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: The request was malformed, or a required field was missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidBody:
              summary: The body is not one JSON object
              value:
                code: "GTW-1007"
                message:
                  key: "error.gatewayservice.invalid_request_body"
                  defaultValue: "The request body is not valid JSON"
            connectionRequired:
              summary: A field needed to reach the data plane is missing
              value:
                code: "GTW-1005"
                message:
                  key: "error.gatewayservice.connection_required"
                  defaultValue: "A base URL, data plane ID and management token are required to reach the gateway"
    Unauthorized:
      description: No valid credentials were presented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No gateway of that id is registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "GTW-1002"
            message:
              key: "error.gatewayservice.gateway_not_found"
              defaultValue: "Gateway not found"
    Conflict:
      description: The registration conflicts with one that already exists, or with the configured bound
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            nameTaken:
              summary: The name is already registered
              value:
                code: "GTW-1004"
                message:
                  key: "error.gatewayservice.name_taken"
                  defaultValue: "A gateway with this name is already registered"
            dataPlaneAlreadyRegistered:
              summary: One data plane registers once
              value:
                code: "GTW-1008"
                message:
                  key: "error.gateway.data_plane_already_registered"
                  defaultValue: "Data plane already registered"
            limitReached:
              summary: The deployment already holds as many gateways as it allows
              value:
                code: "GTW-1006"
                message:
                  key: "error.gatewayservice.limit_reached"
                  defaultValue: "This deployment already administers as many gateways as it is configured to allow"

  schemas:
    RegisterRequest:
      type: object
      required: [name, baseUrl]
      properties:
        name:
          type: string
          description: A label for this gateway, unique within the deployment.
          example: "production"
        baseUrl:
          type: string
          description: |
            Where the data plane answers, and what says which data plane it is.

            **One data plane registers once**, so this is unique within the deployment. A data plane
            reached by more than one name can therefore be registered more than once, under each of
            them; nothing here can tell they are the same deployment. Register the name the control
            plane should call it by.
          example: "https://dp.example.com:8090"
        caCertificate:
          type: string
          description: |
            A PEM certificate to trust when calling this data plane, in addition to the system roots.

            For a data plane serving a certificate no public authority signed, which is what a local
            or on-premise deployment usually has. Leave empty for a data plane behind an ingress with
            a publicly-issued certificate: it verifies against the system roots with nothing here.
    UpdateRequest:
      type: object
      minProperties: 1
      description: |
        What to change. Every property is optional and what is omitted is left as it is, so this is a
        partial update rather than a replacement.
      properties:
        name:
          type: string
          description: A label for this gateway, unique within the deployment.
        baseUrl:
          type: string
          description: Where the data plane answers.
        caCertificate:
          type: string
          description: A PEM certificate to trust when calling this data plane.
    Registration:
      type: object
      description: |
        A registration, and the key it issued.

        The key appears here and nowhere else. It is generated when the gateway is registered, held
        encrypted, and never read back, so this response is the only chance to configure it on the
        data plane. Lose it and the way forward is to rotate, not to look it up.
      allOf:
        - $ref: '#/components/schemas/Gateway'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              format: password
              description: The token this control plane will present to that data plane.
    Gateway:
      type: object
      description: A registered data plane. Carries no `key` property, so no read can disclose one.
      properties:
        id:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        caCertificate:
          type: string
        managedByControlPlane:
          type: boolean
          description: >
            Whether this is the data plane the control plane administers directly, rather than only
            applies configuration to. Exactly one registered gateway holds it, and it is where a
            value created on the control plane is written. The first gateway registered takes it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'
    I18nMessage:
      type: object
      properties:
        key:
          type: string
        defaultValue:
          type: string

  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            system: Manage this deployment
